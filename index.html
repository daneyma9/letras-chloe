    app.querySelectorAll('.obj').forEach(o => o.onclick = () => {
      if (o.classList.contains('done')) { say(NUMW[+o.dataset.n]); return; }
      c++; o.dataset.n = c; o.classList.add('done'); o.style.transform = ''; say(NUMW[c]);
    });
  }
  function letterRound(v, id, done, lower) {
    const x = BY[v], pool = lower ? ABC.filter(a => !RARE.includes(a.l)).map(a => a.l) : knownLetters(v);
    const opts = shuffle([v, ...others(pool, v, nOpts(id) - 1)]);
    choiceRound({
      ask: `¿Dónde está la <span class="hl">${esc(x.name)}</span>?`, say: `¿Dónde está la ${x.name}?`,
      opts: opts.map(l => ({ v: l, html: lower ? l.toLowerCase() : gcase(l) })), correct: v,
      okSay: `Es la ${x.name}, de ${x.word}.`, wrongSay: w => `Esa es la ${BY[w].name}. Busca la ${x.name}.`,
    }, done);
  }
  const ROUND = {
    L: (v, id, done) => letterRound(v, id, done, false),
    l: (v, id, done) => letterRound(v, id, done, true),
    S(v, id, done) {
      const cons = G.stop >= 6 ? ['M','P','L','S','T','N','D'] : ['M','P','L','S'];
      if (!cons.includes(v[0])) cons.push(v[0]);
      const set = new Set([v, v[0] + pick(VOW.filter(x => x !== v[1])), pick(cons.filter(x => x !== v[0])) + v[1]]);
      const n = Math.max(3, nOpts(id));
      while (set.size < n) set.add(pick(cons) + pick(VOW));
      const low = s => s.toLowerCase(), lc = G.stop > LOWER_STOP, d = s => lc ? low(s) : s;
      choiceRound({
        ask: `¿Dónde está <span class="hl">${d(v)}</span>?`, say: `¿Dónde está ${low(v)}?`,
        opts: shuffle([...set]).map(s => ({ v: s, html: d(s) })), correct: v, cls: 'syl',
        okSay: `${letterName(v[0])} con ${low(v[1])}: ${low(v)}.`,
        wrongSay: w => `${letterName(w[0])} con ${low(w[1])} hace ${low(w)}. Busca ${low(v)}.`,
      }, done);
    },
    N(v, id, done) {
      const n = +v, max = Math.max(n <= 5 ? 5 : n <= 10 ? 10 : 20, G.stop >= 12 ? 20 : G.stop >= 5 ? 10 : 5);
      const opts = shuffle([n, ...others(range(0, max), n, nOpts(id) - 1)]);
      choiceRound({
        ask: `¿Dónde está el <span class="hl">${NUMW[n]}</span>?`, say: `¿Dónde está el ${NUMW[n]}?`,
        opts: opts.map(x => ({ v: x, html: x })), correct: n,
        okSay: `Es el ${NUMW[n]}.`, wrongSay: w => `Ese es el ${NUMW[+w]}. Busca el ${NUMW[n]}.`,
      }, done);
    },
    Q(v, id, done) {
      const n = +v, set = new Set([n]);
      [n - 1, n + 1, n + 2, n - 2].filter(x => x >= 1 && x <= 10).forEach(x => { if (set.size < Math.max(3, nOpts(id))) set.add(x); });
      choiceRound({
        ask: '¿Cuántos hay?', say: '¿Cuántos hay? Tócalos para contar.', top: countBox(n, pick(THINGS)),
        opts: shuffle([...set]).map(x => ({ v: x, html: x })), correct: n, bubble: 'Toca cada uno para contar', setup: wireCount,
        okSay: `Hay ${NUMW[n]}.`, wrongSay: w => `Ese es el ${NUMW[+w]}. Vamos a contar despacio.`,
      }, done);
    },
    A(v, id, done) {
      const n = +v, r = n + 1, thing = pick(THINGS), set = new Set([r]);
      [r - 1, r + 1, r - 2, r + 2].filter(x => x >= 1 && x <= 11).forEach(x => { if (set.size < 3) set.add(x); });
      choiceRound({
        ask: `${n} + 1`, say: `${NUMW[n]} y uno más. ¿Cuántos son?`,
        top: `<div class="sumline">${countBox(n, thing)}<span class="plus">+</span>${countBox(1, thing)}</div>`,
        opts: shuffle([...set]).map(x => ({ v: x, html: x })), correct: r, bubble: 'Cuenta todos', setup: wireCount,
        okSay: `${NUMW[n]} más uno son ${NUMW[r]}.`, wrongSay: w => `Ese es el ${NUMW[+w]}. Cuenta todos despacio.`,
      }, done);
    },
    W(v, id, done) {
      const opts = shuffle([v, ...others(Object.keys(GREAD), v, 2)]);
      choiceRound({
        ask: '¿Qué pone aquí?', say: '¿Qué pone aquí? Léelo tú.', top: `<div class="readcard">${esc(v)}</div>`, cls: 'pic',
        opts: opts.map(w => ({ v: w, html: GREAD[w] })), correct: v, bubble: 'Lee despacio',
        okSay: `Pone ${v}.`, wrongSay: w => `Eso es ${w}. Lee otra vez, letra a letra.`,
      }, done);
    },
    F(v, id, done) {
      const [num, noun] = v.split(' ');
      const all = Object.keys(GPHR).filter(p => p !== v);
      const near = shuffle(all).sort((a, b) => sim(b) - sim(a));
      function sim(p) { const [x, y] = p.split(' '); return (x === num ? 1 : 0) + (y.slice(0, 3) === noun.slice(0, 3) ? 1 : 0); }
      const opts = shuffle([v, ...near.slice(0, 2)]);
      choiceRound({
        ask: '¿Qué pone aquí?', say: '¿Qué pone aquí? Léelo tú.', top: `<div class="readcard" style="font-size:clamp(40px,9vw,68px)">${esc(v)}</div>`, cls: 'pic wide',
        opts: opts.map(w => ({ v: w, html: GPHR[w] })), correct: v, bubble: 'Lee las dos palabras',
        okSay: `Pone ${v}.`, wrongSay: w => `Eso es ${w}. Lee otra vez despacio.`,
      }, done);
    },
    B(v, id, done) {
      const letters = [...v.toUpperCase()], lc = G.stop > LOWER_STOP, d = l => lc ? l.toLowerCase() : l;
      let pos = 0, missed = false;
      const ask = () => say(`Vamos a escribir ${v}. ${letters.map(letterName).join(', ')}.`);
      gscreen(`<div class="stage">
        <p class="ask">Forma la palabra</p>
        <div class="picture tap" id="pic" role="button" aria-label="Escuchar la palabra">${GBUILD[v]}</div>
        <div class="slots">${letters.map((l, i) => `<div class="slot${i === 0 ? ' next' : ''}">${d(l)}</div>`).join('')}</div>
        <div class="choices small">${shuffle(letters).map((l, k) => `<button class="tile c${k % 5}" data-l="${l}">${d(l)}</button>`).join('')}</div>
      </div>`, ask);
      say(`Vamos a escribir ${v}.`);
      document.getElementById('pic').onclick = () => say(v);
      const slots = app.querySelectorAll('.slot');
      app.querySelectorAll('.choices .tile').forEach(t => t.onclick = () => {
        if (pos >= letters.length || t.classList.contains('used')) return;
        const l = t.dataset.l;
        if (l === letters[pos]) {
          t.classList.add('used'); slots[pos].classList.remove('next'); slots[pos].classList.add('full'); pos++;
          if (pos < letters.length) { slots[pos].classList.add('next'); say(letterName(l)); }
          else { reward(); praise(`${letters.map(letterName).join(', ')}. ¡${v}! ${pick(PRAISE_SAY)}`, () => done(!missed), 500); }
        } else {
          t.classList.remove('bad'); void t.offsetWidth; t.classList.add('bad'); setTimeout(() => t.classList.remove('bad'), 600);
          miss(); missed = true;
          say(`Esa es la ${letterName(l)}. Busca la ${letterName(letters[pos])}.`);
        }
      });
    },
  };

  function map() {
    screen(`<div class="stage"><p class="ask">Mi camino</p><div class="path">${STOPS.map((s, i) => {
      const st = i < G.stop ? 'done' : i === G.stop ? 'now' : 'lock';
      return `<button class="stopn k-${s.k} ${st}" data-i="${i}">
        <span class="badge${isEm(s.icon) || st === 'lock' ? ' em' : ''}">${st === 'lock' ? '🔒' : s.icon}${st === 'done' ? '<i>⭐</i>' : ''}</span>
        <span class="lbl"><small>Parada ${i + 1}</small><b>${esc(s.name)}</b>${st === 'now' ? `<span class="meter"><i style="width:${Math.round(stopProgress(i) * 100)}%"></i></span><em>▶ Jugar</em>` : ''}</span>
      </button>`;
    }).join('')}</div></div>`, null, false);
    app.querySelectorAll('.stopn').forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (i > G.stop) { b.animate?.([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'none' }], { duration: 300 }); say('Esa parada se abre más adelante.'); }
      else startSession(i);
    });
    app.querySelector('.stopn.now')?.scrollIntoView({ block: 'center' });
  }

  // ---------- Zona de mayores ----------
  function grown() {
    roundId++;
    window.speechSynthesis?.cancel();
    const sts = ABC.map(x => ({ l: x.l, s: status(x.l), a: stats.letters[x.l] || [], t: stats.traced[x.l] || 0 }));
    const nts = NUMW.map((_, n) => ({ l: n, s: statusN(n), a: stats.numbers[String(n)] || [], t: stats.traced['#' + n] || 0 }));
    const ok = sts.filter(x => x.s === 'ok').map(x => x.l), hard = sts.filter(x => x.s === 'hard').map(x => x.l);
    const okN = nts.filter(x => x.s === 'ok').map(x => x.l), hardN = nts.filter(x => x.s === 'hard').map(x => x.l);
    const seen = sts.concat(nts).some(x => x.s !== 'new');
    const sumL = `Letras: reconoce bien ${ok.length} de 27${ok.length ? ` (${ok.join(', ')})` : ''}. ` + (hard.length ? `Le cuestan: ${hard.join(', ')}.` : '');
    const sumN = `Números: reconoce bien ${okN.length} de 21${okN.length ? ` (${okN.join(', ')})` : ''}. ` + (hardN.length ? `Le cuestan: ${hardN.join(', ')}.` : '');
    const tiles = list => list.map(x => {
      const last = x.a.slice(-5), c = last.reduce((s, y) => s + y, 0);
      return `<div class="st-${x.s}"><b>${x.l}</b><small>${last.length ? `${c}/${last.length}` : '—'}</small>${x.t ? `<small>✏️ ${x.t}</small>` : ''}</div>`;
    }).join('');
    const gAll = [...new Set(STOPS.flatMap(s => s.items))];
    const gHard = gAll.filter(id => gi(id).lapses >= 2 && gi(id).b < 3).slice(0, 12);
    const GL = [['find', 'Busca la letra'], ['start', '¿Cómo empieza?'], ['syl', 'Sílabas'], ['build', 'Forma palabras'], ['trace', 'Repasados'], ['nfind', 'Busca el número'], ['count', '¿Cuántos hay?']];
    roundId++;
    app.innerHTML = `
      <div class="bar">
        <button class="round" id="home" aria-label="Volver al menú">🏠</button>
        <div class="stars"><span class="s">⭐</span><b>${stars}</b></div>
        <span class="round" style="visibility:hidden"></span>
      </div>
      <div class="grown">
        <section class="panel">
          <h2>Cuenta</h2>
          <p id="syncmsg"></p>
          <div class="form">
            <label for="pname">Nombre</label>
            <input type="text" id="pname" maxlength="20" autocomplete="off" value="${esc(NAME)}">
          </div>
          <div class="row" style="justify-content:flex-start">
            <button class="pill alt" id="psave">Guardar nombre</button>
            ${CLOUD_ON ? '<button class="pill alt" id="psync">Sincronizar ahora</button><button class="pill warn" id="pout">Cerrar sesión aquí</button>' : ''}
          </div>
        </section>
        <section class="panel">
          <h2>El camino de Lila</h2>
          <p>Va por la <b>parada ${G.stop + 1} de ${STOPS.length}: ${esc(STOPS[G.stop].name)}</b>. Ha hecho ${G.sessions} ${G.sessions === 1 ? 'sesión' : 'sesiones'} en ${G.days.length} ${G.days.length === 1 ? 'día' : 'días'}; lleva ${dayStreak()} seguidos.</p>
          <div class="counts">
            <div><b>${gAll.filter(id => gi(id).b >= 3).length}</b><span>Memorizado</span></div>
            <div><b>${gAll.filter(id => gi(id).seen && gi(id).b < 3).length}</b><span>Aprendiendo</span></div>
            <div><b>${gAll.filter(id => !gi(id).seen).length}</b><span>Por ver</span></div>
          </div>
          <p>${gHard.length ? 'Se le resiste: <b>' + gHard.map(id => esc(label(id))).join(', ') + '</b>.' : 'Ahora mismo no hay nada que se le resista especialmente.'}</p>
          <p style="font-size:14px;color:var(--ink-soft)">Algo cuenta como memorizado cuando lo acierta a la primera en 3 días distintos. Lo aprendido vuelve a salir al cabo de 1, 2, 4, 7 y 14 días; si falla, baja un escalón y sale antes. Una parada se supera con el 80 % acertado a la primera.</p>
          <div class="row" style="justify-content:flex-start">
            <button class="pill alt" id="gprev">◀ Parada anterior</button>
            <button class="pill alt" id="gnext">Parada siguiente ▶</button>
            <button class="pill alt" id="gunlock">${G.unlockAll ? 'Juegos: todos abiertos' : 'Juegos: se abren con el camino'}</button>
          </div>
        </section>
        <section class="panel">
          <h2>Progreso de ${esc(NAME)}</h2>
          <p>${seen ? esc(sumL) + '<br>' + esc(sumN) + '<br>El juego enseña más a menudo lo que le cuesta.' : `${esc(NAME)} todavía no ha jugado. Cuando juegue, aquí verás qué letras y números reconoce y cuáles le cuestan.`}</p>
          <div class="legend">
            <span><i class="dot st-ok"></i>Lo reconoce</span><span><i class="dot st-learn"></i>Aprendiendo</span>
            <span><i class="dot st-hard"></i>Le cuesta</span><span><i class="dot st-new"></i>Sin practicar</span>
          </div>
          <h3>Letras</h3>
          <div class="map">${tiles(sts)}</div>
          <h3>Números</h3>
          <div class="map">${tiles(nts)}</div>
          <p style="font-size:14px;color:var(--ink-soft)">Cada casilla cuenta los aciertos de los últimos 5 intentos. ✏️ indica cuántas veces lo ha repasado con el dedo. Del 11 al 20 aparecen cuando lleva 40 estrellas.</p>
          <div class="counts">${GL.map(([k, n]) => { const v = stats.games[k] || [0, 0]; return `<div><b>${v[0]}</b><span>${n}${k === 'trace' ? '' : ` · ${v[1]} fallos`}</span></div>`; }).join('')}
            <div><b>${Math.min(Math.floor(stars / 10), STICKERS.length)}</b><span>Pegatinas</span></div></div>
          <div class="row" style="justify-content:flex-start"><button class="pill warn" id="reset">Borrar progreso</button></div>
        </section>
        <section class="panel words">
          <h2>Mis palabras</h2>
          <p>Añade palabras que conozca: su nombre, la familia, la mascota o sus juguetes. Saldrán en «Forma palabras» y en «¿Cómo empieza?». Mejor si son cortas, de hasta 8 letras y sin espacios.</p>
          <ul id="wl"></ul>
          <div class="form">
            <label for="nw">Palabra nueva</label>
            <input type="text" id="nw" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Por ejemplo: mamá">
            <label>Dibujo</label>
            <div class="emojis" id="em">${EMOJIS.map((e, i) => `<button type="button" data-e="${e}" aria-pressed="${i === 0}">${e}</button>`).join('')}</div>
            <div class="photo">
              <label class="pill alt" for="ph" style="font-size:18px">📷 O usa una foto</label>
              <input type="file" id="ph" accept="image/*">
              <span id="phprev"></span>
            </div>
            <div class="row" style="justify-content:flex-start"><button class="pill" id="add">Añadir palabra</button></div>
            <div class="msg" id="msg" aria-live="polite"></div>
          </div>
        </section>
      </div>`;
    document.getElementById('home').onclick = home;
    const syncmsg = document.getElementById('syncmsg');
    const SYNC_TXT = { off: 'Este juego aún no está conectado a internet: el progreso se guarda solo en este dispositivo.', idle: 'Conectado. El progreso se guarda en internet.', ok: 'Todo guardado en internet.', pending: 'Guardando…', offline: 'Sin conexión. Se guardará en internet cuando vuelva la red.', denied: 'La contraseña ha cambiado. Cierra sesión y vuelve a entrar.' };
    const paintSync = () => { if (syncmsg.isConnected) syncmsg.textContent = SYNC_TXT[Cloud.status] || ''; };
    Cloud.onchange = paintSync; paintSync();
    document.getElementById('psave').onclick = () => { const v = document.getElementById('pname').value.trim(); if (v) { store.set('name', v.slice(0, 20)); location.reload(); } };
    const psync = document.getElementById('psync');
    if (psync) psync.onclick = async () => { await Cloud.push(); const r = await Cloud.pull(LS.get('pass', '')); if (r === 'ok') location.reload(); };
    const pout = document.getElementById('pout');
    if (pout) pout.onclick = async () => {
      if (!pout.dataset.sure) { pout.dataset.sure = '1'; pout.textContent = '¿Seguro? Toca otra vez'; return; }
      await Cloud.push(); Cloud.logout(); location.reload();
    };

    document.getElementById('gprev').onclick = () => { G.stop = Math.max(0, G.stop - 1); saveG(); grown(); };
    document.getElementById('gnext').onclick = () => { G.stop = Math.min(STOPS.length - 1, G.stop + 1); saveG(); grown(); };
    document.getElementById('gunlock').onclick = () => { G.unlockAll = !G.unlockAll; saveG(); grown(); };

    const reset = document.getElementById('reset');
    reset.onclick = () => {
      if (reset.dataset.sure) {
        stats = { letters: {}, numbers: {}, traced: {}, games: {} }; saveStats();
        G = { stop: 0, items: {}, days: [], sessions: 0, unlockAll: G.unlockAll }; saveG();
        stars = 0; store.set('stars', 0); grown();
      } else {
        reset.dataset.sure = '1'; reset.textContent = '¿Seguro? Toca otra vez para borrar';
        setTimeout(() => { if (reset.isConnected) { delete reset.dataset.sure; reset.textContent = 'Borrar progreso'; } }, 4000);
      }
    };

    const wl = document.getElementById('wl'), msg = document.getElementById('msg');
    const renderWords = () => {
      wl.innerHTML = myWords.length ? myWords.map((w, i) => `<li><span class="pic">${pic(w.e)}</span><span class="nm">${esc(w.word)}</span><button class="del" data-i="${i}" aria-label="Quitar ${esc(w.word)}">✕</button></li>`).join('')
        : '<li><span class="nm" style="font-size:16px;font-weight:400;color:var(--ink-soft)">Aún no hay palabras.</span></li>';
      wl.querySelectorAll('.del').forEach(b => b.onclick = () => { myWords.splice(+b.dataset.i, 1); store.set('words', myWords); renderWords(); });
    };
    renderWords();

    let chosen = EMOJIS[0], photo = null;
    const em = document.getElementById('em');
    em.querySelectorAll('button').forEach(b => b.onclick = () => {
      chosen = b.dataset.e; photo = null; document.getElementById('phprev').innerHTML = '';
      em.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
    document.getElementById('ph').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => {
        const s = 240, c = document.createElement('canvas'); c.width = s; c.height = s;
        const m = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
        photo = c.toDataURL('image/jpeg', .75); URL.revokeObjectURL(url);
        document.getElementById('phprev').innerHTML = `<img src="${photo}" alt="Foto elegida">`;
        em.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
      };
      img.onerror = () => { msg.className = 'msg err'; msg.textContent = 'No se ha podido abrir esa imagen. Prueba con otra foto.'; };
      img.src = url;
    };
    document.getElementById('add').onclick = () => {
      const input = document.getElementById('nw');
      const word = input.value.trim();
      if (!word) { msg.className = 'msg err'; msg.textContent = 'Escribe una palabra primero.'; return; }
      if (!/^[a-záéíóúüñ]+$/i.test(word)) { msg.className = 'msg err'; msg.textContent = 'Usa solo letras, sin espacios ni números.'; return; }
      if (!BY[firstLetter(word)]) { msg.className = 'msg err'; msg.textContent = 'Esa palabra empieza por una letra que el juego no conoce.'; return; }
      myWords.push({ word, e: photo || chosen });
      if (!store.set('words', myWords)) {
        myWords.pop(); msg.className = 'msg err';
        msg.textContent = 'No se ha podido guardar. Si usas muchas fotos, quita alguna palabra o usa un dibujo.'; return;
      }
      input.value = ''; photo = null; document.getElementById('phprev').innerHTML = '';
      msg.className = 'msg'; msg.textContent = `Añadida: ${word}`;
      renderWords();
    };
  }

    home();
  }

  boot();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
